<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión — TriTransportes</title>
<style>
    :root { --navy:#0f172a; --ambar:#f59e0b; }
    * { box-sizing:border-box; }
    body {
        margin:0; min-height:100vh;
        display:flex; align-items:center; justify-content:center;
        padding:24px; text-align:center;
        font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
        color:#e2e8f0;
        background:
            radial-gradient(ellipse 80% 60% at 20% 20%, rgba(245,158,11,.15) 0%, transparent 55%),
            linear-gradient(145deg, #0f172a 0%, #1e293b 45%, #0f2044 100%);
    }
    .caja { max-width:420px; }
    .icono {
        width:96px; height:96px; margin:0 auto 26px;
        border-radius:26px; display:flex; align-items:center; justify-content:center;
        font-size:44px;
        background:linear-gradient(160deg, rgba(245,158,11,.28), rgba(245,158,11,.10));
        border:1px solid rgba(251,191,36,.45);
    }
    h1 { font-size:1.5rem; font-weight:800; margin:0 0 12px; }
    p  { font-size:.95rem; line-height:1.65; color:rgba(226,232,240,.78); margin:0 0 12px; }
    .nota {
        margin-top:22px; padding:14px 16px; border-radius:14px; font-size:.85rem;
        background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10);
        color:rgba(226,232,240,.85);
    }
    button {
        margin-top:24px; width:100%; min-height:50px;
        border:none; border-radius:12px; cursor:pointer;
        font-size:1rem; font-weight:800; color:#1a2537;
        background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 45%,#d97706 100%);
        box-shadow:0 14px 26px rgba(245,158,11,.35);
    }
    .marca { margin-top:28px; font-size:.72rem; letter-spacing:.22em; color:rgba(226,232,240,.45); }
</style>
</head>
<body>
    <div class="caja">
        <div class="icono">📡</div>
        <h1>Sin conexión</h1>
        <p>
            No hay señal en este momento y esta pantalla todavía no estaba
            guardada en el teléfono.
        </p>
        <div class="nota">
            Los registros que hayas creado sin conexión están guardados y se
            enviarán automáticamente cuando vuelva la señal. No los repitas.
        </div>
        <button onclick="location.reload()">Reintentar</button>
        <div class="marca">TriTransportes</div>
    </div>
</body>
</html>
