# TriTransportes · nginx delante de PHP-FPM (servicio "api").
# La aplicación vive en /TriTransportes, igual que en el servidor de demostración,
# para que las rutas sean idénticas en ambos ambientes.
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php index.html;
    server_tokens off;
    client_max_body_size 21m;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://api.groq.com" always;

    # Salud del propio nginx (la salud completa, con base de datos, es /TriTransportes/api/v1/health)
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = / { return 302 /TriTransportes/app/; }

    # Código, dependencias, configuración y archivos ocultos: nunca se sirven
    location ~ ^/TriTransportes/(vendor|src|tests|database|docker|config|core|logs|includes)/ { return 404; }
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(sql|md|lock|dist|sh|ini|log|bak)$ { return 404; }
    location ~ ^/TriTransportes/(phinx|bootstrap)\.php$ { return 404; }

    # API REST: todo lo que no sea un archivo entra por el controlador frontal
    location ^~ /TriTransportes/api/v1/ {
        rewrite ^/TriTransportes/api/v1/(export|export_pdf|options|record|record_report|chatbot)$ /TriTransportes/api/v1/$1.php last;
        try_files $uri /TriTransportes/api/v1/index.php$is_args$args;
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass api:9000;
            fastcgi_read_timeout 60s;
        }
    }

    # Front end (aplicación de una página) y recursos estáticos
    location ^~ /TriTransportes/app/ { try_files $uri $uri/ /TriTransportes/app/index.html; expires 1h; }
    location ~* \.(css|js|svg|png|jpg|webp|ico|woff2?)$ { expires 30d; access_log off; try_files $uri =404; }

    # Sistema clásico: URLs limpias (/login → login.php)
    location /TriTransportes/ { try_files $uri $uri/ @php_limpio; }
    location @php_limpio { rewrite ^(.+?)/?$ $1.php last; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass api:9000;
        fastcgi_read_timeout 60s;
    }
}
